name: CI — Vigilus commerce
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP 8.3 + extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, xml, curl
          coverage: none
      - name: Composer
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Laravel tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
